groups:
  - name: oengo-admin-alerts
    rules:
      - alert: ServiceDown
        expr: up{service=\"oengo-admin\"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: \"oengo-admin instance is down\"
          description: \"Pod for oengo-admin has been down for more than 1 minute.\"
      - alert: High5xxRate
        expr: rate(http_requests_total{service=\"oengo-admin\",status=~\"5..\"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: \"Elevated 5xx error rate on oengo-admin\"