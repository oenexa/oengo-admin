# ==============================================================================
# OenGo Commerce Administration & Dispute Engine — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oengo-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oengo-admin-standalone
    ports:
      - "3011:3011"
    environment:
      PORT: "3011"
      NODE_ENV: production
      OENGO_API_URL: ${OENGO_API_URL:-http://localhost:3001}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3011/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
